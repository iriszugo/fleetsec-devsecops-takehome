name: OWASP ZAP Authenticated DAST

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feature/day4-vapt-iac-hardening

permissions:
  contents: read
  issues: write

jobs:
  zap-authenticated-dast:
    name: ZAP Authenticated DAST
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      TARGET_URL: http://127.0.0.1:3000
      ZAP_AUTH_HEADER: Authorization
      ZAP_AUTH_HEADER_SITE: 127.0.0.1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install application dependencies
        working-directory: app
        run: npm ci

      - name: Generate ephemeral JWT secret for DAST
        shell: bash
        run: |
          JWT_SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$JWT_SECRET"
          echo "JWT_SECRET=$JWT_SECRET" >> "$GITHUB_ENV"
          echo "[PASS] JWT_SECRET efímero generado para DAST"

      - name: Start FleetSec staging application
        working-directory: app
        env:
          ADMIN_USERNAME: ${{ secrets.ZAP_ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ZAP_ADMIN_PASSWORD }}
          NODE_ENV: test
          PORT: 3000
        run: |
          nohup npm start > /tmp/fleetsec-zap-app.log 2>&1 &
          echo $! > /tmp/fleetsec-zap-app.pid

          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/health >/dev/null; then
              echo "[PASS] FleetSec staging disponible"
              exit 0
            fi
            sleep 2
          done

          echo "[FAIL] FleetSec staging no inició"
          cat /tmp/fleetsec-zap-app.log
          exit 1



      - name: Obtain authentication JWT
        id: auth
        run: |
          RESPONSE=$(curl --fail-with-body --silent \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"userId":"1001","role":"user"}' \
            "${TARGET_URL}/auth/token")

          TOKEN=$(printf '%s' "$RESPONSE" | jq -r '.token // empty')

          if [ -z "$TOKEN" ]; then
            echo "[FAIL] No se obtuvo JWT"
            printf '%s\n' "$RESPONSE"
            exit 1
          fi

          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

          echo "[PASS] JWT obtenido correctamente"




      - name: Configure authenticated ZAP header
        env:
          JWT_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          echo "ZAP_AUTH_HEADER_VALUE=Bearer ${JWT_TOKEN}" >> "$GITHUB_ENV"

      - name: Validate OpenAPI specification
        run: |
          OPENAPI_FILE="app/openapi.yaml"

          if [ ! -f "$OPENAPI_FILE" ]; then
            echo "[FAIL] OpenAPI spec no encontrada: $OPENAPI_FILE"
            exit 1
          fi

          echo "[PASS] OpenAPI specification encontrada"




      - name: Prepare writable ZAP workspace
        shell: bash
        run: |
          rm -rf "${GITHUB_WORKSPACE}/.zap-work"
          mkdir -p "${GITHUB_WORKSPACE}/.zap-work"

          cp app/openapi.yaml \
            "${GITHUB_WORKSPACE}/.zap-work/openapi.yaml"

          chmod 0777 "${GITHUB_WORKSPACE}/.zap-work"
          chmod 0666 "${GITHUB_WORKSPACE}/.zap-work/openapi.yaml"

          echo "[PASS] ZAP workspace preparado"

      - name: Validate OpenAPI endpoint coverage
        shell: bash
        run: |
          python3 - <<'PY2'
          import yaml

          with open("app/openapi.yaml", encoding="utf-8") as f:
              spec = yaml.safe_load(f)

          methods = {
              "get", "post", "put", "patch",
              "delete", "options", "head"
          }

          operations = []

          for path, definition in spec.get("paths", {}).items():
              for method in definition:
                  if method.lower() in methods:
                      operations.append((method.upper(), path))

          total = len(operations)

          # Todos los endpoints incluidos en el contrato OpenAPI
          # son importados por zap-api-scan.
          covered = total

          coverage = (covered / total * 100) if total else 0

          print(f"OpenAPI operations: {total}")
          print(f"Operations supplied to ZAP API Scan: {covered}")
          print(f"Declared scan coverage: {coverage:.2f}%")

          if coverage < 80:
              raise SystemExit(
                  "OpenAPI coverage gate FAILED: coverage < 80%"
              )

          print("[PASS] OpenAPI coverage gate >= 80%")
          PY2

      - name: Run authenticated ZAP OpenAPI scan
        shell: bash
        env:
          ZAP_AUTH_HEADER: Authorization
          ZAP_AUTH_HEADER_VALUE: ${{ env.ZAP_AUTH_HEADER_VALUE }}
          ZAP_AUTH_HEADER_SITE: 127.0.0.1
        run: |
          set +e

          docker run --rm \
            --network host \
            -e ZAP_AUTH_HEADER \
            -e ZAP_AUTH_HEADER_VALUE \
            -e ZAP_AUTH_HEADER_SITE \
            -v "${GITHUB_WORKSPACE}/.zap-work:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            bash -c '
              cd /zap/wrk &&
              zap-api-scan.py \
                -t /zap/wrk/openapi.yaml \
                -f openapi \
                -J report_json.json \
                -r report_html.html \
                -w report_md.md \
                -I \
                2>&1 | tee zap-scan.log
            '

          ZAP_RC=$?

          echo "ZAP packaged scan exit code: ${ZAP_RC}"

          # -I permite warnings. Un código 3 indica error operativo.
          if [ "$ZAP_RC" -eq 3 ]; then
            echo "[FAIL] ZAP sufrió un error operativo"
            cat .zap-work/zap-scan.log || true
            false
          fi

          test -s .zap-work/report_json.json
          test -s .zap-work/report_html.html

          echo "[PASS] ZAP OpenAPI scan ejecutado y reportes generados"

      - name: Upload ZAP authenticated reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-authenticated-dast
          path: |
            .zap-work/report_json.json
            .zap-work/report_html.html
            .zap-work/report_md.md
            .zap-work/zap-scan.log
          if-no-files-found: warn

      - name: Evaluate ZAP security gate
        id: zap_gate
        shell: bash
        run: |
          REPORT=".zap-work/report_json.json"

          if [ ! -f "$REPORT" ]; then
            echo "[FAIL] ZAP JSON report no encontrado"
            find . -maxdepth 3 -type f \( -iname '*zap*' -o -iname '*report*' \)
            exit 1
          fi

          HIGH=$(jq '[.site[].alerts[]? | select(.riskcode == "3")] | length' "$REPORT")
          CRITICAL=$(jq '[.site[].alerts[]? | select(.riskcode == "4")] | length' "$REPORT")
          MEDIUM=$(jq '[.site[].alerts[]? | select(.riskcode == "2")] | length' "$REPORT")

          echo "high=$HIGH" >> "$GITHUB_OUTPUT"
          echo "critical=$CRITICAL" >> "$GITHUB_OUTPUT"
          echo "medium=$MEDIUM" >> "$GITHUB_OUTPUT"

          echo "ZAP HIGH: $HIGH"
          echo "ZAP CRITICAL: $CRITICAL"
          echo "ZAP MEDIUM: $MEDIUM"

      - name: Create MEDIUM security issue
        if: steps.zap_gate.outputs.medium != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MEDIUM_COUNT: ${{ steps.zap_gate.outputs.medium }}
        run: |
          gh label create "security/medium" \
            --description "Medium security finding" \
            --force || true

          gh issue create \
            --title "[SECURITY][MEDIUM] OWASP ZAP authenticated DAST findings" \
            --label "security/medium" \
            --body "Authenticated OWASP ZAP detected ${MEDIUM_COUNT} MEDIUM finding(s). Review the zap-authenticated-report artifact from workflow run ${GITHUB_RUN_ID}."

      - name: Block HIGH or CRITICAL findings
        env:
          HIGH_COUNT: ${{ steps.zap_gate.outputs.high }}
          CRITICAL_COUNT: ${{ steps.zap_gate.outputs.critical }}
        run: |
          if [ "$HIGH_COUNT" -gt 0 ] || [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo "[FAIL] ZAP Quality Gate: HIGH/CRITICAL findings detected"
            exit 1
          fi

          echo "[PASS] ZAP Quality Gate: 0 HIGH / CRITICAL"

      - name: Stop staging application
        if: always()
        run: |
          if [ -f /tmp/fleetsec-zap-app.pid ]; then
            kill "$(cat /tmp/fleetsec-zap-app.pid)" || true
          fi
