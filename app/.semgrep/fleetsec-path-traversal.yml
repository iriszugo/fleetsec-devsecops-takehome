rules:
  - id: fleetsec-path-traversal-unvalidated-file

    message: "Possible Path Traversal detected. User-controlled input is used to build a filesystem path without secure path validation."

    severity: ERROR

    languages:
      - javascript

    patterns:
      - pattern: |
          path.join($BASE, $FILE)

      - pattern-inside: |
          $FILE = $REQ.query.$PARAM;
          ...

    metadata:
      category: security

      technology:
        - nodejs
        - express

      cwe:
        - CWE-22

      owasp:
        - "A01:2021-Broken Access Control"

      confidence: HIGH
      impact: HIGH
      likelihood: HIGH
